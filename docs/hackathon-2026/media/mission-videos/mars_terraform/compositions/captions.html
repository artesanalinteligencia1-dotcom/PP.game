    <div id="cap-vo1" class="k-cap clip" data-start="1.2" data-duration="7.72">Billions of years ago, water flowed on Mars. Rivers built deltas, like this one in Jezero crater.</div>

    <div id="cap-vo3" class="k-cap clip" data-start="14.6" data-duration="8.23">Since 2014, NASA's MAVEN orbiter has measured how the Sun strips gas from the top of the Martian atmosphere.</div>
    <div id="cap-vo4" class="k-cap clip" data-start="22.93" data-duration="6.59">Without a global magnetic shield, the solar wind carried much of the air away over time.</div>
    <div id="cap-vo5" class="k-cap clip" data-start="31.42" data-duration="4.11">To warm Mars, we would need a much thicker atmosphere.</div>
    <div id="cap-vo6" class="k-cap clip" data-start="35.63" data-duration="10.83">In 2018, a NASA-supported study added up all the carbon dioxide we could release. It would bring the pressure to only a few percent of Earth's.</div>
    <div id="cap-vo7" class="k-cap clip" data-start="46.56" data-duration="5.29">Not enough. With today's technology, Mars cannot be terraformed.</div>
