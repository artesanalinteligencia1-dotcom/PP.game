<template>

    <div id="hi-stage" class="k-stage">
      <div class="k-space"></div>

      <svg class="k-svg" viewBox="0 0 1920 1080">

        <g transform="translate(1180 520)">

  <script>
    const tl = gsap.timeline({ paused: true }); const c = K.cues("history");
    const r = K.rng(11); let sw = "", loss = "";

    document.querySelector("#hi-sw").innerHTML = sw; document.querySelector("#hi-loss").innerHTML = loss;
    K.enter(tl, "#hi-stage", "rise");
    K.fade(tl, "#hi-k", 0.4, 0.5, 0); K.photo(tl, "#hi-p", 0.5); K.kb(tl, "#hi-p img", 0.5, c.dur, { s: 1.0 }, { s: 1.12 });

    document.querySelectorAll(".hi-l").forEach((el, i) => { for (let k = 0; k < 4; k++) { const s = c("vo4", 0.4) + (i % 9) * 0.25 + k * 2.2;

    K.draw(tl, "#hi-mag", c("vo4", 0.2), 1.2);
    K.fade(tl, "#hi-n", c("vo4", 1.0), 0.5, 0);
