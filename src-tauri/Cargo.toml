[package]
name = "ppgame"
version = "0.1.0"
description = "PP.game — Space Mission Design (desktop build)"
license = "MIT"
edition = "2021"

[lib]
name = "ppgame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
